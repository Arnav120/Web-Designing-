<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" align="Center">

     <label for="Full Name"> Full Name :</label>
     <input type="text" name="Full Name" id=""Full Name>
     <br><br>

     <label for="E-mail" > E-mail :</label>
     <input type="email" name="Email" id="Email">
     <br><br>
    
     <label for="Phone">Phone Number :</label>
     <input type="tel" name="Phone No" id="Phone No">
     <br><br>

     <label for="Check In"> Check-In-Date :</label>
     <input type="date" name="Check In" id="Check In">
     <br><br>

     <label for="Ckeck-Out-date"> Check-Out-date :</label>
     <input type="date" name="Check Out" id="Check Out">
     <br><br>

     <label for="Room Type"> Room Type:</label>
     <select name="Room Type" id="Room Type">
     <option value="Single"> Single</option>
     <option value="Double"> Double</option>
     <option value="Luxury"> Luxury</option>
     <option value="Suite"> Suite</option>
        </select>
        <br><br>

        <label for="Number Of Guests">Number of Guests</label>
        <input type="number" name="No Of Guest" id="Number Of Guest" rows="5" cols="10">
        <br><br>
        <label for="Special Request"> Special Request</label><br>
        <textarea name="Special Request" id="Special Request" rows="5" cols="50"></textarea>
        <br><br>

        <button>Submit Form</button>
        <button>Reset Form</button>
     </form>
</body>
</html>
