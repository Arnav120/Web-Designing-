
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Menu Using Lists</title>

    <style>
        .output {
            border: 1px solid #4CAF50;
            padding: 22px 60px;
            margin-top: 10px;
        }

        ul {
            list-style-type: none;
            background-color: #333;
            padding: 15px;
            margin: 0;
            display: flex;
        }

        li {
            margin-right: 40px;
        }

        li a {
            color: white;
            text-decoration: none;
            font-family: Georgia, serif;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="output">

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

    </div>

</body>
</html>
